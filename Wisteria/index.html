<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wisteria sinensis</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #bcd3e6;
        font-family: system-ui, 'Segoe UI', sans-serif;
      }
      canvas#scene {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #label {
        position: fixed;
        left: 24px;
        top: 20px;
        color: #fff;
        text-shadow: 0 1px 10px rgba(30, 20, 60, 0.55);
        pointer-events: none;
        user-select: none;
      }
      #label h1 {
        margin: 0;
        font: italic 500 clamp(20px, 2.8vw, 30px) 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
      }
      #label p {
        margin: 4px 0 0;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.9;
      }
      #label p.stats {
        text-transform: none;
        letter-spacing: 0.02em;
        opacity: 0.75;
      }

      #timeline {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        width: min(880px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 12px 16px 10px;
        border-radius: 14px;
        background: rgba(28, 22, 44, 0.62);
        backdrop-filter: blur(10px);
        color: #fff;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 14px;
        align-items: center;
      }
      #timeline button {
        font: inherit;
        color: #fff;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 9px;
        height: 36px;
        padding: 0 12px;
        cursor: pointer;
      }
      #timeline button:hover {
        background: rgba(255, 255, 255, 0.24);
      }
      #timeline button:focus-visible,
      #timeline input:focus-visible {
        outline: 2px solid #d9c9ff;
        outline-offset: 2px;
      }
      #buttons {
        display: flex;
        gap: 8px;
        grid-row: span 2;
      }
      #play {
        width: 44px;
        font-size: 15px;
      }
      #when {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      #when b {
        font-weight: 600;
      }
      #when span {
        opacity: 0.8;
        text-align: right;
      }
      #scrub {
        width: 100%;
        margin: 0;
        accent-color: #b9a2ea;
      }
      #error {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        color: #33264d;
        text-align: center;
      }
      @media (max-width: 600px) {
        #label {
          left: 14px;
          top: 12px;
        }
        #label p.stats {
          display: none;
        }
        #replant {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="label">
      <h1>Wisteria sinensis</h1>
      <p>Chinese wisteria &middot; growth simulation</p>
      <p class="stats" id="stats"></p>
    </div>
    <div id="timeline">
      <div id="buttons">
        <button id="play" aria-label="Play or pause the time-lapse">&#9654;</button>
        <button id="replant" title="Go back to planting day and play">Replant</button>
      </div>
      <div id="when"><b id="date"></b><span id="phase"></span></div>
      <input id="scrub" type="range" min="0.2" max="12.45" step="0.002" aria-label="Time since planting" />
    </div>
    <div id="error"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
